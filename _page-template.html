<!doctype html>
<html lang="zh-CN" data-site-root="$siteRoot$" data-page-path="$pagePath$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>$pagetitle$ · Gustave 行测知识站</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232d5b46'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='22' fill='white'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="$siteRoot$/assets/styles.css">
  <script defer src="$siteRoot$/assets/site.js"></script>
</head>
<body>
  <div class="site-layout">
    <aside class="sidebar" id="sidebar" aria-label="知识站导航">
      <div class="brand">
        <a href="$siteRoot$/index.html" aria-label="返回知识站首页">
          <span class="brand-mark">G</span>
          <span><strong>行测知识站</strong><small>江西省考 · 个人体系</small></span>
        </a>
      </div>
      <div class="sidebar-search">
        <label for="nav-search">搜索目录</label>
        <input id="nav-search" type="search" placeholder="输入题型或技巧…" autocomplete="off">
      </div>
      <nav id="site-nav" class="site-nav"></nav>
    </aside>

    <div class="page-column">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menu-button" type="button" aria-label="打开目录" aria-expanded="false">☰</button>
        <button class="back-button" id="back-button" type="button" aria-label="返回上一页">← 返回</button>
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="面包屑"></nav>
        <a class="home-button" href="$siteRoot$/index.html">首页</a>
      </header>

      <main class="article-wrap">
        <article class="prose" id="article-content">
$body$
        </article>
        <nav class="pager" id="page-pager" aria-label="上一篇和下一篇"></nav>
        <footer class="article-footer">
          <span>HTML 为当前维护版本</span>
          <button type="button" id="scroll-top">回到顶部 ↑</button>
        </footer>
      </main>
    </div>
  </div>
  <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>
</body>
</html>
